<html>
    <head>
        <title>
            my food menu
        </title>
        <style>
            body{
                font-family:arial;
                background:#fff8f0;
                text-align:center;
            }
            h1{
                color: #e65c00;
            }
            /*sibling selctor - styles the paragraph right after h1*/
            h1 + p {
                background:#ffe0b2;
                border-radius:8px;
                color:#bf360c
            }
            /*child selctor - styles only direct li childeren of ul*/
            ul > li{
                list-style:none;
                font-size: 18px;
                font-weight:bold;
                color:#5d4037;
                width: 2px;
                background:#fff3e0;
                border-radius: 8px;
            }
             /* nth-child - highlights the 3rd item as Chef's Special */
              ul li:nth-child(3) {
              background: #ffe082;
              color: #e65c00;
              }
              .desc{
                color:#555;
                font-size:15px;
                width: 400px;
              }
              /* first letter - makes the first letter big and bold*/
              .desc::first-letter {
                font-size: 220%;
                color:#e65c00;
                font-weight:bold;
              }
              /* hover effect - links glow when mouse move over them*/
              a{
                color:#e65c00;
                text-decoration:none;
                font-size:15px;
                border:2px solid #e65c00;
                border-radius: 8px;
              }
              a:hover {
                background:#e65c00;
                color: white;
              }
              
        </style>
        <body>
            <h1>
                my food menue
            </h1>
            <p>
                pick your favourite dish and dig in
            </p>
            <ul>
                <li>
                    pizza
                </li>
                <li>
                    bergur
                </li>
                <li>
                    tacos - chef's speacil
                </li>
                <li>
                    noodles
                </li>
                <li>
                    ice cream
                </li>
            </ul>
            <p class="desc">every dish on this menuis made with love and loads of flauvor. try them all and find your favourite</p>
            <div clas="links">
               <a href="#">order now</a>
            </div>


        </body>
    </head>
</html>
