<html>
    <body>
        <p>
            A function can access variables defined inside the function:
        </p>
        <button type="button" onclick="myfunction()">Click me</button>
        <p id="demo"></p>
        <p id="demo2"></p>
        <script>
            var b = 5;
            function myfunction() {
                var a =40; 
                document.getElementById("demo").innerHTML= b*a;
            }
            document.getElementById("demo").innerHTML= a;
            document.getElementById("demo2").innerHTML= b;
            
        </script>
    </body>
</html>
