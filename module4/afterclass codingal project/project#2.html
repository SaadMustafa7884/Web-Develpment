<!DOCTYPE html>
<html>
  <head>
   <style>
    h1 { 
        color:burlywood;
        text-align:center;
        font-size: 100px;
    }
    body{
        background-color:rgb(151, 125, 6);
    }
    button{
        background-color: rgb(175, 123, 26);
        color: white;
        border: none;
        padding: 10px 20px;
        text-align: center;
        text-decoration: none;
        font-size: 16px;
        margin: 4px 2px;
        animation: bounce 3s infinite;
    }
    @keyframes bounce{
  0% {
    transform:translateY(0)
   } 
   80%{
    transform:translateY(-100px)
   }
   100%{
    transform:translateY(0)
   }
}

    #result{
        color:black;
        font-size: 30px;
        text-align:center;
        border-radius: 10%; 
        border: 2px solid black;
        padding: 10px;

    }
   </style>
  </head>

  <body>
    <h1>Multiply Function</h1>
    <button onclick="multiply(4)">Click to get the result!</button>
    <p id="result"></p>
    <script>
function multiply(a,b)
{
    if(b === undefined)
    {
    alert ("The value of b is undefined");
    b=10000;
    }
    var result = a * b;
    document.getElementById("result").innerHTML = result;
}

</script>




  </body>
</html>
