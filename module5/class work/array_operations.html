<html>
    <head>
        <title>
            My playlist sorter
        </title>
        <link  rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body {
                background:lavender;
            }
            h1, h3 {
                    color:darkviolet;
                }
            .box { 
                background: white;
                color: darkviolet;
                }
            
        </style>
    </head>
    <body>
        <div class="container py-4"></div>
            <h1 class="mb-1">My playlist Sorter</h1>
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song names</h3>
                    <div id="nameResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song names</h3>
                    <div id="countResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>
            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song names</h3>
                    <div id="labelResult" class="box p-3 mt-3 rounded"></div>
                </div>
            </div>
            <script>
                var songs =["zoom", "bounce", "jhol", "sayira", "passori"];
                var plays = [100, 200, 300, 400, 500];

                document.getElementById("nameResult").innerHTML = "songs: " + songs.sort();
                document.getElementById("countResult").innerHTML = "plays: " + plays.sort(function(a,b) {return b-a});
                document.getElementById("labelResult").innerHTML = "songs: " + plays.map(function(c) {return c+" plays"});
                
            </script>

    </body>
</html>
