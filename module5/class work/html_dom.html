><html>

<head>
    <title>
        My Zoo
    </title>
    <style>
        body {
            text-align: center;
        }

        h1 {
            color: #ff5a43;
        }

        .zone {
            border: 1px solid #ff5a43;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        }

        button {
            background: #ff5a43;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>
        My zoo
    </h1>
    <div id="zoo">
        <div class="zone">Zone 1: <span id="zone1"></span></div>
        <div class="zone">Zone 2: <span id="zone2"></span></div>
        <div class="zone">total animals: <span id="total"></span></div>
    </div>
    <br>
    <button onclick="openzoo()">Add Animal</button>
    <script>
        function openzoo() {
            document.getElementById("zone1").innerHTML = "lion";
            document.getElementById("zone2").innerHTML = "elephant";
            document.getElementById("total").innerHTML = "3";
            document.getElementById("zoo").style.backgroundColor = "green";

        }


    </script>
</body>

</html>
