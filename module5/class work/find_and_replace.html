<!DOCTYPE html>
<html>

<head>
    <title>Find and Replace</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background: lightyellow;
        }

        h2 {
            color: darkorange;
        }

        .box {
            background: white;
            color: darkorange;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <div class="card">
            <h2>
                Find and Replace
            </h2>
            <p>
                the dragon flew over the big castle.
            </p>
            <input id="findW" class="form-control mb-2" placeholder="find">
            <input id="swapW" class="form-control mb-2" placeholder="replace">
            <button class="btn btn-warning" onclick="findword()">find</button>
            <button class="btn btn-warning" onclick="replaceword()">replace</button>
            <div id="result" class="box p-3 mt-3 rounded">

            </div>
        </div>
    </div>
    <script>
        var sen = "The dragon flew over the big castle.";
        function findword() {
            var w = document.getElementById("findW").value;
            var p = sen.search(w);
            document.getElementById("result").innerText = "waord found at position:" + p;
        }

        function replaceword() {
            var w = document.getElementById("findW").value;
            var newW = document.getElementById("swapW").value;

            document.getElementById("result").innerText = sen.replace(w, newW);
        }

    </script>
</body>

</html>
