<html>
    <head>
        <title>My planet card</title>
        <style>
            body {
                background:#f0f4ff;
                padding: 30px;
                text-align: center;
            }
            h1 {
                color:#ff5a43;
            }
            p {
                color:#555;
            }
            .cards {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 25px;
            }
            button {
                background: #ff5a43;
                color: white;
                border: none;
                padding: 12px 28px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>
            My planet cards
        </h1>
        <p>
            use a javascript class to build planet cards!
        </p>
        <button onclick="showPlanets()">show planets!</button>
        <div class="cards">
            <div id="card1"></div>
            <div id="card2"></div>
            <div id="card3"></div>
        </div>
        <script>
            class Planet {
                constructor(name,fact) {
                    this.name = name;
                    this.fact = fact;
                }
                describe() {
                    return this.name  + ":" + this.fact;
                }    
            }
            function showPlanets() {
                let p1 = new Planet("earth", "the only planet with life");
                let p2 = new Planet("mars","known as the red planet");
                let p3 = new Planet("jupiter","the largest planet in our solar system");
            document.getElementById("card1").innerHTML = p1.name + p1.describe() 
            document.getElementById("card2").innerHTML = p2.name + p2.describe()
            document.getElementById("card3").innerHTML = p3.name + p3.describe()
            }
        </script>
    </body>
</html>
